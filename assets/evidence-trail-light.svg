<svg xmlns="http://www.w3.org/2000/svg" width="360" height="418" viewBox="0 0 360 418" role="img" aria-labelledby="title desc">
<title id="title">Working with evidence</title>
<desc id="desc">Define scope, inspect context, act within authority, then check and record outcomes as passed, failed, or unverified. These working principles are adapted to each task.</desc>
<rect x="1" y="1" width="358" height="416" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="system-ui, sans-serif">
<text x="20" y="34" fill="#0f172a" font-size="19" font-weight="700">Working with evidence</text>
<rect x="16" y="50" width="328" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="28" y="74" fill="#0e7490" font-size="16" font-weight="700">1. Define scope</text>
<text x="28" y="96" fill="#334155" font-size="14">Agree on the problem and checks.</text>
<path d="M180 115 v9 m-4 -4 4 4 4 -4" fill="none" stroke="#0e7490" stroke-width="2"/>
<rect x="16" y="128" width="328" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="28" y="152" fill="#0e7490" font-size="16" font-weight="700">2. Inspect context</text>
<text x="28" y="174" fill="#334155" font-size="14">Read documentation, code, evidence.</text>
<path d="M180 193 v9 m-4 -4 4 4 4 -4" fill="none" stroke="#0e7490" stroke-width="2"/>
<rect x="16" y="206" width="328" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="28" y="230" fill="#0e7490" font-size="16" font-weight="700">3. Act within authority</text>
<text x="28" y="252" fill="#334155" font-size="14">Use native tools; keep people in control.</text>
<path d="M180 271 v9 m-4 -4 4 4 4 -4" fill="none" stroke="#0e7490" stroke-width="2"/>
<rect x="16" y="284" width="328" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="28" y="308" fill="#0e7490" font-size="16" font-weight="700">4. Check and record</text>
<text x="28" y="330" fill="#334155" font-size="14">Report outcomes with evidence.</text>
<text x="20" y="384" fill="#0f172a" font-size="14" font-weight="600">passed / failed / unverified</text>
<text x="20" y="405" fill="#334155" font-size="14">Record remaining limits, too.</text>
</g>
</svg>
