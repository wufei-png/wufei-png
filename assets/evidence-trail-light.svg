<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="title desc">
  <title id="title">Working with evidence</title>
  <desc id="desc">Define scope, inspect context, act within authority, then check and record outcomes as passed, failed, or unverified. Record remaining limits, too. These working principles are adapted to each task.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#94a3b8" opacity="0.18"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="838" height="298" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="12" y="12" width="816" height="276" rx="12" fill="url(#dots)"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="28" y="29" fill="#0e7490" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.8">HOW I BUILD</text>
    <text x="28" y="57" fill="#0f172a" font-size="24" font-weight="700" text-anchor="start">Working with evidence</text>
    <path d="M108 126 H732" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M208 122 l4 4 -4 4" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M416 122 l4 4 -4 4" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M624 122 l4 4 -4 4" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="108" cy="126" r="18" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="108" y="131" fill="#0e7490" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="108" y="174" fill="#0f172a" font-size="18" font-weight="650" text-anchor="middle">Define scope</text>
    <text x="108" y="197" fill="#475569" font-size="16" font-weight="400" text-anchor="middle">Agree on the problem</text>
    <text x="108" y="216" fill="#475569" font-size="16" font-weight="400" text-anchor="middle">and checks.</text>
    <circle cx="316" cy="126" r="18" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="316" y="131" fill="#0e7490" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="316" y="174" fill="#0f172a" font-size="18" font-weight="650" text-anchor="middle">Inspect context</text>
    <text x="316" y="197" fill="#475569" font-size="16" font-weight="400" text-anchor="middle">Read documentation,</text>
    <text x="316" y="216" fill="#475569" font-size="16" font-weight="400" text-anchor="middle">code, and evidence.</text>
    <circle cx="524" cy="126" r="18" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="524" y="131" fill="#0e7490" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="524" y="174" fill="#0f172a" font-size="18" font-weight="650" text-anchor="middle">Act within authority</text>
    <text x="524" y="197" fill="#475569" font-size="16" font-weight="400" text-anchor="middle">Use native tools;</text>
    <text x="524" y="216" fill="#475569" font-size="16" font-weight="400" text-anchor="middle">keep people in control.</text>
    <circle cx="732" cy="126" r="18" fill="#fffbeb" stroke="#92400e" stroke-width="1.5"/>
    <text x="732" y="131" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="732" y="174" fill="#0f172a" font-size="18" font-weight="650" text-anchor="middle">Check and record</text>
    <text x="732" y="197" fill="#475569" font-size="16" font-weight="400" text-anchor="middle">Report outcomes</text>
    <text x="732" y="216" fill="#475569" font-size="16" font-weight="400" text-anchor="middle">with evidence.</text>
    <path d="M24 242 H816" fill="none" stroke="#cbd5e1"/>
    <rect x="28" y="260" width="76" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="66.0" y="278" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">passed</text>
    <rect x="114" y="260" width="70" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="149.0" y="278" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">failed</text>
    <rect x="194" y="260" width="106" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="247.0" y="278" fill="#475569" font-size="13" font-weight="600" text-anchor="middle">unverified</text>
    <text x="812" y="278" fill="#475569" font-size="14" font-weight="400" text-anchor="end">Record remaining limits, too.</text>
  </g>
</svg>
