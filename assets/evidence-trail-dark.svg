<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Evidence trail</title>
  <desc id="desc">A data packet moves once from a question through retrieval, reasoning, and a tool call to a verified receipt.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d" opacity="0.8"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .packet { animation: travel 5s cubic-bezier(.45,0,.25,1) .35s 1 both; }
      .receipt-ring { animation: receipt 520ms ease-out 4.8s 1 both; }
      .check { stroke-dasharray: 36; stroke-dashoffset: 36; opacity: 0; animation: draw 420ms ease-out 5s 1 forwards; }
      @keyframes travel {
        0%, 10% { transform: translate(92px, 153px); }
        23%, 31% { transform: translate(326px, 153px); }
        44%, 52% { transform: translate(560px, 153px); }
        65%, 73% { transform: translate(794px, 153px); }
        90% { opacity: 1; transform: translate(1028px, 153px); }
        96%, 100% { opacity: 0; transform: translate(1028px, 153px); }
      }
      @keyframes receipt { from { opacity: .45; } to { opacity: 1; } }
      @keyframes draw { from { opacity: 0; stroke-dashoffset: 36; } to { opacity: 1; stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .packet { animation: none; opacity: 0; transform: translate(1028px, 153px); }
        .receipt-ring { animation: none; }
        .check { animation: none; opacity: 1; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="276" rx="23" fill="url(#dots)"/>
  <text x="44" y="48" fill="#f0f6fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.7">QUESTION TO VERIFIED RECEIPT</text>
  <text x="44" y="74" fill="#8b949e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">The animation runs once, then leaves the evidence visible.</text>

  <path d="M92 153 H1028" fill="none" stroke="#30363d" stroke-width="6" stroke-linecap="round"/>
  <path d="M92 153 H794" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
  <path d="M794 153 H1028" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(92 153)"><circle r="18" fill="#161b22" stroke="#22d3ee" stroke-width="3"/><text y="49" fill="#c9d1d9" font-size="15" font-weight="600">Question</text></g>
    <g transform="translate(326 153)"><circle r="18" fill="#161b22" stroke="#22d3ee" stroke-width="3"/><text y="49" fill="#c9d1d9" font-size="15" font-weight="600">Retrieve</text></g>
    <g transform="translate(560 153)"><circle r="18" fill="#161b22" stroke="#22d3ee" stroke-width="3"/><text y="49" fill="#c9d1d9" font-size="15" font-weight="600">Reason</text></g>
    <g transform="translate(794 153)"><circle r="18" fill="#161b22" stroke="#f59e0b" stroke-width="3"/><text y="49" fill="#c9d1d9" font-size="15" font-weight="600">Tool call</text></g>
    <g transform="translate(1028 153)">
      <circle class="receipt-ring" r="25" fill="#271d0b" stroke="#f59e0b" stroke-width="4"/>
      <path class="check" d="M-11 0 L-3 9 L13 -10" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="49" fill="#c9d1d9" font-size="15" font-weight="700">Receipt</text>
      <text y="70" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1">VERIFIED</text>
    </g>
  </g>

  <g class="packet" filter="url(#glow)">
    <rect x="-10" y="-10" width="20" height="20" rx="5" fill="#22d3ee" stroke="#083344" stroke-width="3"/>
  </g>
</svg>
